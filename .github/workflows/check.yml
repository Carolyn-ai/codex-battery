name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public files
        run: python3 scripts/privacy_check.py
      - name: Run native checks
        run: |
          chmod +x build.sh test.sh install.sh scripts/install.sh scripts/package.sh 一键安装.command
          ./test.sh
